{% assign current_locale = page.locale | default: "all" %}
<details class="language-nav">
  <summary class="language-nav-toggle" aria-label="Language menu">
    <svg class="language-nav-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.5 6h-2.2c-.2-1.2-.6-2.3-1.2-3.2 1.5.6 2.8 1.7 3.4 3.2zM12 4c.8 1.1 1.4 2.4 1.6 4h-3.2C10.6 6.4 11.2 5.1 12 4zM4 12c0-.7.1-1.4.3-2h3c-.1.7-.2 1.3-.2 2s.1 1.3.2 2h-3c-.2-.6-.3-1.3-.3-2zm.5 4h2.2c.2 1.2.6 2.3 1.2 3.2-1.5-.6-2.8-1.7-3.4-3.2zM7 8H4.5c.7-1.5 1.9-2.6 3.4-3.2-.6.9-1 2-1.2 3.2zm1.4 4c-.1-.7-.2-1.3-.2-2s.1-1.3.2-2h3.6c.1.7.2 1.3.2 2s-.1 1.3-.2 2H8.4zm.4 4c-.6-.9-1-2-1.2-3.2h2.2c.2 1.2.6 2.3 1.2 3.2-.8-.3-1.6-.7-2.2-1.2zm3 1c-.8-1.1-1.4-2.4-1.6-4h3.2c-.2 1.6-.8 2.9-1.6 4zm2.8-.8c.6-.9 1-2 1.2-3.2h2.2c-.7 1.5-1.9 2.6-3.4 3.2zm1.4-4.2c.1-.7.2-1.3.2-2s-.1-1.3-.2-2h3c.2.6.3 1.3.3 2s-.1 1.4-.3 2h-3zm.2-4c-.2-1.2-.6-2.3-1.2-3.2 1.5.6 2.8 1.7 3.4 3.2h-2.2z" fill="currentColor"></path>
    </svg>
    <span class="sr-only">Language</span>
  </summary>
  <div class="language-nav-inner">
    <a href="{{ '/' | relative_url }}" class="nav-link {% if current_locale == 'all' %}active{% endif %}">
      <span class="lang-name">All</span>
    </a>
    <a href="{{ '/ru/' | relative_url }}" class="nav-link {% if current_locale == 'ru' %}active{% endif %}">
      <span class="lang-name">Russian</span>
    </a>
    <a href="{{ '/en/' | relative_url }}" class="nav-link {% if current_locale == 'en' %}active{% endif %}">
      <span class="lang-name">English</span>
    </a>
  </div>
</details>

<style>
.language-nav {
    margin: 20px 0;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.language-nav-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border: 1px solid #ddd;
    border-radius: 50%;
    background: #f8f9fa;
    cursor: pointer;
    color: #333;
    transition: all 0.3s ease;
}

.language-nav-toggle::-webkit-details-marker {
    display: none;
}

.language-nav-toggle::marker {
    content: "";
}

.language-nav-toggle:hover {
    background: #eef1f4;
}

.language-nav-inner {
    display: none;
    gap: 15px;
    justify-content: center;
    margin-top: 12px;
}

.language-nav[open] .language-nav-inner {
    display: flex;
}

.nav-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 5px;
    text-decoration: none;
    color: #666;
    transition: all 0.3s ease;
    border: 1px solid transparent;
}

.nav-link:hover {
    background: #f8f9fa;
    color: #333;
    text-decoration: none;
}

.nav-link.active {
    background: #007bff;
    color: white;
    border-color: #007bff;
}

.nav-link .flag {
    font-size: 1.2em;
}

.nav-link .lang-name {
    font-weight: 500;
}

@media only screen and (max-width: 768px) {
    .language-nav-inner {
        flex-direction: column;
        gap: 10px;
    }
    
    .nav-link {
        justify-content: center;
    }
}
</style>
